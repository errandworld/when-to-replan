[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "errandworld"
version = "0.1.0"
description = "ErrandWorld: a deterministic errand simulator for studying when LLM agents should replan."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []  # Phase 1 is stdlib-only by design.

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["errandworld*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
